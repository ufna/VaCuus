[FilterPlugin]
; This section lists additional files which will be packaged for distribution. Paths should be listed relative to the
; root plugin directory, and may include "...", "*", and "?" wildcards to match directories, files, and individual
; characters respectively.
;
; DELIBERATELY EMPTY. Task 14 went looking for the entries that would stage Content/DevUI and
; found that neither of the two things this file was believed to do is true. Both claims were
; checked against the engine source at UE 5.8.1 rather than assumed:
;
; 1. THIS FILE HAS NOTHING TO DO WITH A COOKED GAME. Its only consumer in the entire engine is
;    `RunUAT BuildPlugin`, which builds a REDISTRIBUTABLE PLUGIN:
;    Programs/AutomationTool/Scripts/BuildPluginCommand.Automation.cs:472 loads
;    Config/FilterPlugin.ini and :453 reads the [FilterPlugin] section into the file filter.
;    The string "FilterPlugin" appears in no other AutomationTool source file, and neither
;    CopyBuildToStagingDirectory nor DeploymentContext consults it. So an empty section here
;    could never have been the reason a packaged game shipped no UI documents.
;
; 2. FOR `BuildPlugin`, Content IS ALREADY STAGED. The default filter that file builds before
;    reading this one already includes /Content/... (:465), plus /Shaders/... (:467) and
;    /Source/... (:468), and excludes only /Tests/... (:469). Every loose .rml, .rcss, .png and
;    .ttf under Content/DevUI therefore already travels in a plugin zip, as does the vendored
;    RmlUi licence. Listing them here would restate an engine default -- which reads as
;    load-bearing, gets maintained forever, and would silently mask the day Epic narrows that
;    default.
;
; WHERE THE REAL FIX WENT: staging loose files into a COOKED GAME is RuntimeDependencies, which
; UBT expands into the .target receipt and CopyBuildToStagingDirectory stages from. That is
; declared in Source/VaCuus/VaCuus.Build.cs, next to the code that resolves the same paths at
; runtime, with the citations for the staging chain.
;
; So: add entries here only for files a REDISTRIBUTABLE PLUGIN needs and the default filter does
; not already carry -- e.g. something under /Extras or /Binaries/ThirdParty. Nothing in VaCuus
; qualifies today.
