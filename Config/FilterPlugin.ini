[FilterPlugin]
; This section lists additional files which will be packaged for distribution, and files to
; strike from the default set. Paths are relative to the plugin root; "...", "*", "?" are
; wildcards; a leading "-" makes a rule an exclude (FileFilter.cs:125-134); a leading "/"
; anchors the pattern to the plugin root (FileFilter.cs:322-337). Rules are applied ON TOP
; of BuildPlugin's default filter, and the LATEST matching rule wins, so entries here
; override the defaults (BuildPluginCommand.Automation.cs:459-472 builds the default set --
; the .uplugin + manifest build products + /Binaries/ThirdParty/... + /Resources/... +
; /Content/... + /Intermediate/Build/.../Inc/... + /Shaders/... + /Source/... minus
; /Tests/... -- then reads this file).
;
; SCOPE (verified at UE 5.8.1, unchanged since Task 14 checked it): this file's only
; consumer in the entire engine is `RunUAT BuildPlugin` -- the REDISTRIBUTABLE PLUGIN zip,
; i.e. the Fab package. It has nothing to do with cooking or staging a game; that is
; RuntimeDependencies in Source/VaCuus/VaCuus.Build.cs and, since M6, the cooked
; UVaCuusBundle. Add entries here only for what the plugin ZIP needs.
;
; AND SINCE FAB REVIEW ROUND 1 THIS FILE IS ALSO A PACKAGE FILE: the reviewer reads it to
; check that every folder outside a plugin's expected shape (here docs/ and Web/) is one
; the publisher declared on purpose. The rule that ships it is at the bottom, and the
; consequence is that these comments now have two audiences -- us, and whoever grades the
; next submission.
;
; M6 (spec §2(e), §3.3 -- the Fab dry-run). Each rule carries its reason:

; Web/ ships SOURCE-ONLY (arch spec's Fab-compliance mandate: buyers fetch esbuild/preact
; from npm themselves). No default rule includes /Web/ at all
; (BuildPluginCommand.Automation.cs:459-472 has no such line), so without this rule the
; package would carry no Web workspace and the TSX/CLI story would be download-and-wonder.
/Web/...

; ...and node_modules must NOT ride along with it: Web/node_modules contains a real ELF
; executable (Web/node_modules/@esbuild/linux-x64/bin/esbuild), a hard stop under Fab's
; .exe/.msi ban and the no-executables scan (Tools/fab_scan.sh). npm hoists the workspace
; to the single root Web/node_modules today; the second rule catches any nested
; node_modules a future workspace layout might grow.
-/Web/node_modules/...
-/Web/.../node_modules/...

; Upstream RmlUi demo backends: never compiled (VaCuusRml.Build.cs's include list names
; only Source/Core paths), carrying the tree's only `.at(` call sites (30, in
; RmlUi_Renderer_DX12.cpp -- bead akj.6.9's evidence scope) plus compile_shaders.py
; helper scripts and per-backend licenses for code we do not ship. Excluding the
; directory is what makes "zero .at( in the compiled subtree" and the packaged tree
; coincide.
-/Source/ThirdParty/RmlUi/Backends/...

; A dry-run FINDING (2026-08-02), not a guess: BuildPlugin adds every manifest build
; product by exact path (BuildPluginCommand.Automation.cs:462) plus the UHT headers
; (:466), so the raw package carried Binaries/Linux/*.so/.sym/.debug and 674
; Intermediate files. Right for a precompiled drop; wrong for THIS plugin's only
; distribution channel -- the Fab source-only submission (mandate 4.3.6.1.a), where a
; shipped .so is exactly what the no-executables scan exists to stop. These rules land
; after the build-product rules, and the latest matching rule wins, so the package IS
; the upload shape; the three compile legs remain the proof of compilability. (If a
; /Binaries/ThirdParty payload ever appears, it needs a re-include below the first
; rule.)
-/Binaries/...
-/Intermediate/...

; THE DOCUMENTATION, which until now shipped NOWHERE. BuildPlugin's default filter has no
; rule for root files other than the descriptor itself (BuildPluginCommand.Automation.cs:
; 459-472), so README.md was excluded by omission -- and the buyer-install simulation of
; 2026-08-02 graded GREEN only because the installer read docs/buyer/*.md out of the DEV
; TREE. Its own deliverable proves it: the authored document cites "gotchas.md #1" and
; "#9", accurately, from files the package does not contain. So the run measured a
; documented buyer's first day, and a real buyer's first day had never been measured
; (bead avu, finding C2; the honest re-run is bead n3w).
;
; README.md is the page that tells a buyer to enable the plugin at all, and carries the
; symlink/UBA warning. The four buyer pages are the ones every other page cross-references
; by name: a citation to "gotchas.md #18" is a dead pointer without the file.
/README.md
/docs/buyer/...

; ...except the handoff, which is an INTERNAL page: it enumerates the owner's unrun
; hardware matrix, machine hostnames and bead ids. Of two matching rules the one added
; LATER wins -- FindMatchingNode keeps the higher RuleNumber (FileFilter.cs:582-587), and
; rules are numbered in the order they are added -- so this exclude beats the include and
; a future docs/buyer/ page ships by default -- deliberately, because the failure mode that
; actually happened was a doc that did not ship, not one that did.
-/docs/buyer/owner-handoff.md

; ...and except agents-root.md, which is a SOURCE rather than a page: Tools/fab_package.sh
; copies it into the package as the root AGENTS.md, where a buyer's coding agent will
; actually meet it. Shipping it at both paths would put the same text in the package twice
; and give the agent two front doors, one of them buried.
-/docs/buyer/agents-root.md

; THE THIRD-PARTY NOTICES, a root file and therefore excluded by omission like README.md
; was (the BPC:459-472 rule above). Every vendored licence's own file already rides along
; under Source/ThirdParty and Content, and this is the summary that says what they are and
; where they live -- the one page that answers "what is in here and may I ship it".
/THIRD-PARTY-NOTICES.md

; NOT the repository's own AGENTS.md and CLAUDE.md. Both are about DEVELOPING this plugin
; -- beads, the two-tree build, the dev-loop hazards -- and handing them to a buyer's agent
; would point it at a workflow and a directory layout that do not exist on its machine.
; They are already excluded by omission; these rules exist so that stays a DECISION rather
; than an accident, which is exactly the failure that lost README.md for three milestones.
-/AGENTS.md
-/CLAUDE.md

; ---------------------------------------------------------------------------------------
; FAB TECHNICAL REVIEW, ROUND 1 (2026-08-16, package built at ac611d1). Two of the three
; Code Plugins failures were this file's to answer; the third was the descriptor's.

; THE RE-VENDOR SCRIPTS DO NOT SHIP. Fab: "The plugin will not be compiled until
; executables are removed: Source/VaCuusJs/gen_relays.sh, Source/VaCuusRml/gen_relays.sh."
; M6 had decided the opposite -- ship them as source with the exec bit stripped, because
; they are the documented re-vendor procedure and are invoked as `bash .../gen_relays.sh`
; (docs/research/m6-api-notes/buildplugin-fab-dryrun.md §2, and the shebang whitelist that
; used to name them in Tools/fab_scan.sh). The reviewer counts a .sh as an executable
; whatever its permission bits, and Fab is the gatekeeper, so the decision is reversed for
; the package only: both files stay in the repository, where a re-vendor needs them, and
; neither reaches a buyer. They are pure build-time tooling for OUR vendoring -- a buyer
; who never re-vendors RmlUi or quickjs-ng loses nothing. Tools/fab_inventory.sh asserts
; their absence, so this cannot silently regress.
-/Source/VaCuusJs/gen_relays.sh
-/Source/VaCuusRml/gen_relays.sh

; THIS FILE SHIPS. Fab: "The FilterPlugin.ini needs to list all folders or files that are
; outside the expected file structure and are intended to be included." It always did list
; them -- /Web/... and /docs/buyer/... above -- but the list never reached the reviewer:
; BuildPlugin's default filter has no /Config/... rule at all
; (BuildPluginCommand.Automation.cs:459-472), so the package carried docs/ and Web/ with
; nothing in it to say why. The rule is anchored to the one file rather than /Config/...
; so that a future FilterPluginWin64.ini or an editor-written Config/*.ini does not start
; riding along unnoticed.
;
; The copy inside the package is INERT -- BuildPlugin reads this file from the source tree,
; never from a package (SCOPE, above). It is documentation for a human grader.
/Config/FilterPlugin.ini

; TWO ROOT FILES IN THE PACKAGE ARE NOT PRODUCED BY THIS FILTER, and a reviewer auditing
; the package against these rules should not have to wonder where they came from:
; Tools/fab_package.sh writes both AFTER BuildPlugin has run -- AGENTS.md, materialised
; from docs/buyer/agents-root.md (see its exclude rule above), and PACKAGE-MANIFEST.txt,
; the commit and build stamp for the artifact. No filter rule can name them because
; neither exists in the source tree at the path it ships at.
