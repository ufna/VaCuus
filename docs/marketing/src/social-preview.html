<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VaCuus — GitHub social preview</title>
    <link rel="stylesheet" href="../../fab/src/base.css" />
    <style>
      /* ------------------------------------------------- social preview --
         The image GitHub shows when the repository link is pasted anywhere
         (Settings -> General -> Social preview). GitHub asks for 1280x640, a
         2:1 tile -- og.jpg is 1200x630 and would be cropped. Same composition
         as the Fab thumbnail (docs/fab/src/thumbnail.html) refitted to 2:1,
         and deliberately WITHOUT the test-count badge: this image is uploaded
         by hand through a settings page, so nothing in the release flow would
         ever remind anyone to re-render it. Every claim left on it is one that
         holds until a new engine version is supported. Recipe:
         docs/marketing/README.md. */

      html,
      body,
      .tile {
        width: 1280px;
        height: 640px;
      }

      .ticks i:nth-child(1),
      .ticks i:nth-child(2) {
        top: 22px;
      }
      .ticks i:nth-child(3),
      .ticks i:nth-child(4) {
        bottom: 22px;
      }
      .ticks i:nth-child(1),
      .ticks i:nth-child(3) {
        left: 22px;
      }
      .ticks i:nth-child(2),
      .ticks i:nth-child(4) {
        right: 22px;
      }
      .ticks i {
        width: 20px;
        height: 20px;
      }

      .top {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 44px;
      }
      .eyebrow {
        font-size: 15px;
      }

      .lead {
        position: absolute;
        left: 60px;
        top: 178px;
        width: 700px;
        display: flex;
        gap: 26px;
      }
      .lead .bar {
        width: 10px;
        flex: none;
        align-self: stretch;
      }

      .wordmark {
        font-size: 150px;
        margin: -18px 0 0;
      }

      .tagline {
        margin: 22px 0 0;
        font-size: 35px;
        line-height: 1.18;
        font-weight: 450;
        font-stretch: 104%;
        letter-spacing: -0.017em;
        color: var(--vc-ink);
      }
      .tagline em {
        font-style: normal;
        font-weight: 650;
        color: var(--vc-accent);
      }

      .badges {
        display: flex;
        gap: 12px;
        margin-top: 34px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 10px 15px;
        background: var(--vc-panel);
        border: 1px solid var(--vc-line);
        border-left: 3px solid var(--vc-accent);
        border-radius: 2px;
        font-family: var(--vc-font-mono);
        font-size: 17px;
        letter-spacing: 0.02em;
        color: var(--vc-ink-2);
        white-space: nowrap;
      }
      .badge b {
        color: var(--vc-ink);
        font-weight: 600;
      }

      /* ---- a real capture: the world-quad JS demo, as on og.jpg ---- */
      .shot {
        position: absolute;
        margin: 0;
        left: 776px;
        right: -1px;
        top: 86px;
        height: 500px;
        background: var(--vc-bezel);
        border: 1px solid var(--vc-line);
        border-right: 0;
        border-radius: 4px 0 0 4px;
        padding: 9px 0 0 9px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 36px rgba(0, 0, 0, 0.45);
      }
      .shot .frame {
        position: relative;
        display: block;
        width: 100%;
        height: 446px;
        overflow: hidden;
        border-radius: 2px 0 0 0;
        /* site/public/shots/world.png (vacuus.M5World, 1920x1080) at 0.5x:
           the panel cluster centred, sky above, converging floor below. */
        background-image: url('/site/public/shots/world.png');
        background-size: 960px auto;
        background-position: -262px -26px;
        background-repeat: no-repeat;
      }
      .shot .frame::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(8, 10, 13, 0.92) 0%, transparent 14%);
      }
      .shot .bar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 12px 14px 0 2px;
        font-family: var(--vc-font-mono);
        font-size: 14px;
        color: #8b95a2;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .shot .bar .tag {
        color: var(--vc-accent-bright);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="bg-grid"></div>
      <div class="bg-glow"></div>
      <span class="ticks"><i></i><i></i><i></i><i></i></span>

      <div class="top rail">
        <span class="eyebrow">HTML / CSS UI for Unreal Engine</span>
        <span class="dash"></span>
        <span class="eyebrow"><b>github.com/ufna/VaCuus</b></span>
      </div>

      <div class="lead">
        <span class="bar hazard"></span>
        <div>
          <div class="wordmark">Va<span class="c">C</span>uus</div>
          <p class="tagline">Game UI in HTML/CSS &mdash;<br /><em>off the game thread</em></p>
          <div class="badges">
            <span class="badge"><b>UE 5.6 &ndash; 5.8</b></span>
            <span class="badge">Win, Mac, Linux, Android, iOS</span>
          </div>
        </div>
      </div>

      <figure class="shot">
        <span class="frame"></span>
        <figcaption class="bar">
          <span class="tag">vacuus.M5World</span>
          <span>JS + data binding on a world quad</span>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
